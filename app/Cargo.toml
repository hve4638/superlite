[package]
name = "superlight-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
superlight-backend = { path = "../backend/relay" }
superlight-common = { path = "../backend/common" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread"] }
getrandom = "0.3"
# 폴더 선택 dialog — plugin-dialog 대신 rfd 직접 사용 (권한·JS 패키지 추가 없이 커맨드 안에서 끝난다)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
