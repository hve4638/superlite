[package]
name = "superlite"
version.workspace = true
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
superlite-backend = { path = "../backend/relay" }
superlite-common = { path = "../backend/common" }
tauri = { version = "2", features = [] }
# 프로세스 1개 강제 — 두 번째 실행의 argv·cwd 를 첫 프로세스에 전달하고 종료
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
getrandom = "0.3"
# 세션 탭 payload(list_sessions·sessions-changed)와 상태 지속(state.json,
# docs/decision/state-persistence.md) 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 폴더 선택·확인 dialog — plugin-dialog 대신 rfd 직접 사용 (권한·JS 패키지 추가 없이 커맨드 안에서 끝난다).
# common-controls-v6: Windows 확인 창을 MessageBox 대신 TaskDialog 로 — 커스텀 버튼 라벨(Save / Don't Save)이
# 이 기능에서만 붙는다 (tauri-build 기본 매니페스트가 Common-Controls v6 를 이미 선언한다)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio", "common-controls-v6"] }
# 탐색기 다운로드의 로컬 쓰기(local_write) — 프론트가 와이어에서 받은 base64 청크를 그대로 넘긴다
base64 = "0.22"
# 터미널 링크·URL 탭의 외부 열기를 OS 기본 브라우저로 (open_url) — plugin-opener 대신 rfd 처럼 커맨드 안에서 직접
# (같은 일을 하던 tauri-plugin-opener 는 ticket user-settings 에서 제거).
# 편집기 "Open Externally"(ticket open-externally, open_externally) 도 같은 crate 로 임시 사본을 OS 기본 앱으로
open = "5"

# OS 드롭 경로 수신 (WebMessageObjects) — tauri/wry 가 쓰는 것과 같은 버전 계열이어야
# with_webview 로 받은 COM 인터페이스 타입이 일치한다
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows-core = "0.61"
# 가상 데스크톱 배치 (ticket window-virtual-desktop) — 공개 COM IVirtualDesktopManager(Win32_UI_Shell)와
# 순번 → GUID 변환용 레지스트리 읽기(Win32_System_Registry). tauri 가 쓰는 것과 같은 0.61 계열이라
# hwnd() 의 HWND 타입이 일치한다
# 창 아이콘 (ticket app-icon-quality) — exe 리소스 ICO 를 LoadImageW 로 꺼내 WM_SETICON 큰·작은 둘 다 세팅
# (Win32_UI_WindowsAndMessaging·Win32_System_LibraryLoader·Win32_UI_HiDpi)
# OS 입력기 전환 (ticket editor-vim-ime-imswitch) — vim normal 모드 진입 시 IMM32 WM_IME_CONTROL 로 IME 를 닫는다 (Win32_UI_Input_Ime)
# IME 진단 (ticket term-ime-window-topright, 임시) — 조합 창 후보의 소유 프로세스 이름 (Win32_System_Threading)
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_Ime", "Win32_System_Threading"] }
