# superlite 내장 tmux 기본 설정 — 데몬이 $HOME/.cache/<SLUG>/tmux/base.conf 로 써 두고 -f 로 준다.
# 사용자 설정(클라이언트의 tmux.conf — 사이드바 터미널 뷰에서 편집)은 끝에서 source 되어 이 값을 덮는다.
# 서버는 -L <SLUG> 전용 소켓이라 사용자의 평소 tmux 서버·~/.tmux.conf 와 격리된다.

# 셸: 로그인 셸 (~/.profile·~/.bashrc 등 로드 — 데몬은 로그인 세션 밖에서 떠 환경이 빈약하다).
# TMUX·TMUX_PANE 은 지운다 — 안에서 친 tmux 명령이 사용자의 기본 서버로 가고(중첩 경고 없음,
# kill-server 가 이 서버를 죽이지 않는다), 이 서버는 SUPERLITE_TMUX_SOCKET 으로 지목한다
set -g default-command 'export SUPERLITE_TMUX_SOCKET="${TMUX%%,*}"; unset TMUX TMUX_PANE; exec "${SHELL:-/bin/sh}" -l'

# 보이지 않는 tmux — 상태줄 없음, prefix 없음 (Ctrl+B 는 셸로 간다, terminal-usability 결정)
set -g status off
set -g prefix None

set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
# 같은 세션을 보는 탭이 여럿이면 마지막으로 크기를 바꾼 쪽에 맞춘다
set -g window-size latest
set -g automatic-rename on
