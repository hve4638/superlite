[package]
name = "superlite"
version.workspace = true
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
superlite-backend = { path = "../backend/relay" }
superlite-common = { path = "../backend/common" }
tauri = { version = "2", features = [] }
# 프로세스 1개 강제 — 두 번째 실행의 argv·cwd 를 첫 프로세스에 전달하고 종료
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
getrandom = "0.3"
# 세션 탭 payload(list_sessions·sessions-changed)와 상태 지속(state.json,
# docs/decision/state-persistence.md) 직렬화
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 폴더 선택 dialog — plugin-dialog 대신 rfd 직접 사용 (권한·JS 패키지 추가 없이 커맨드 안에서 끝난다)
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

# OS 드롭 경로 수신 (WebMessageObjects) — tauri/wry 가 쓰는 것과 같은 버전 계열이어야
# with_webview 로 받은 COM 인터페이스 타입이 일치한다
[target."cfg(windows)".dependencies]
webview2-com = "0.38"
windows-core = "0.61"
