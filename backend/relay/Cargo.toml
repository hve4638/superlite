[package]
name = "superlight-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
superlight-common = { path = "../common" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
serde_json = "1"
futures-util = "0.3"
