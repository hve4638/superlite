[package]
name = "superlight-backend"
version.workspace = true
edition = "2021"

[dependencies]
superlight-common = { path = "../common" }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
