# superlite 내장 tmux 기본 설정 — 데몬이 $HOME/.cache/<SLUG>/tmux/base.conf 로 써 두고 -f 로 준다.
# 사용자 설정(클라이언트의 tmux.conf — 사이드바 터미널 뷰에서 편집)은 끝에서 source 되어 이 값을 덮는다.
# 서버는 -L <SLUG> 전용 소켓이라 사용자의 평소 tmux 서버·~/.tmux.conf 와 격리된다.

# 셸: 로그인 셸 (~/.profile·~/.bashrc 등 로드 — 데몬은 로그인 세션 밖에서 떠 환경이 빈약하다).
# TMUX·TMUX_PANE 은 지운다 — 안에서 친 tmux 명령이 사용자의 기본 서버로 가고(중첩 경고 없음,
# kill-server 가 이 서버를 죽이지 않는다), 이 서버는 SUPERLITE_TMUX_SOCKET 으로 지목한다
set -g default-command 'export SUPERLITE_TMUX_SOCKET="${TMUX%%,*}"; unset TMUX TMUX_PANE; exec "${SHELL:-/bin/sh}" -l'

# 보이지 않는 tmux — 상태줄 없음, prefix 없음 (Ctrl+B 는 셸로 간다, terminal-usability 결정)
set -g status off
set -g prefix None

# default-terminal 은 데몬이 이 파일 뒤에 붙인다 (tmux.rs base_conf_path — 그 머신 terminfo 에 tmux-256color 가 있으면
# 그것, 없으면 screen-256color). 바깥 터미널은 늘 프론트 xterm.js(TERM=xterm-256color) 라 truecolor 를 여기서 선언한다 —
# -a(append)가 아닌 대입이라 데몬 시작마다 이 파일을 다시 source 해도 값이 불어나지 않는다 (ticket terminal-font-color)
set -g terminal-overrides ",xterm-256color:RGB"
# pane 안 프로그램(chalk·ink 의 Claude Code 등)은 TERM 이 아니라 COLORTERM 으로 truecolor 를 판정한다 — 없으면 256 색으로
# 양자화해 Windows Terminal 과 색이 달라 보인다. 전역 환경이라 살아 있던 세션의 새 pane 에도 미친다
set-environment -g COLORTERM truecolor
set -g mouse on
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 10
set -g history-limit 50000
# 같은 세션을 보는 탭이 여럿이면 마지막으로 크기를 바꾼 쪽에 맞춘다
set -g window-size latest
set -g automatic-rename on

# 가운데 버튼(휠 클릭)의 기본 동작인 paste-buffer(마지막 드래그 선택 붙여넣기)를 끈다 — 브라우저 클립보드와
# 무관하게 붙여넣어져 오동작으로 보인다 (사용자 결정 2026-09-09)
unbind -n MouseDown2Pane

# 우클릭 pane 메뉴는 -O (열어 둔 채 호버·클릭 선택). 기본 메뉴는 "누른 채 끌어 항목 위에서 뗀다" 방식인데,
# xterm.js 6 이 tmux 의 마우스 모드 전환(?1002l → ?1003h) 중 document mouseup 리스너를 떼어 우클릭 뗌이
# tmux 에 닿지 않아 메뉴가 굳는다 (ticket term-tmux-menu-mouseup). 항목은 tmux 3.7b 기본 pane 메뉴
# (key-bindings.c DEFAULT_PANE_MENU) 그대로 — 안쪽 앱이 마우스를 원하면(mouse_any_flag) 기본과 같이 넘긴다
bind -n MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -O -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' Kill X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
